<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RCTP 桃園機場專業航管模擬器</title>
    <!-- 引入 Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        @keyframes radar-sweep {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .radar-sweep-line {
            position: absolute;
            top: 0; left: 50%;
            width: 50%; height: 100%;
            background: linear-gradient(90deg, rgba(34, 197, 94, 0) 0%, rgba(34, 197, 94, 0.2) 100%);
            transform-origin: left center;
            animation: radar-sweep 8s linear infinite;
            pointer-events: none;
            border-top-right-radius: 100%;
        }
        @keyframes pulse-red {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(1.3); }
        }
        .conflict-alert {
            animation: pulse-red 0.5s infinite;
        }
    </style>
</head>
<body class="bg-slate-950 font-sans min-h-screen flex flex-col items-center justify-between p-4 text-emerald-400 select-none">

    <!-- 主容器 -->
    <div class="w-full max-w-2xl bg-slate-900 rounded-2xl shadow-2xl overflow-hidden flex flex-col border border-emerald-900/50 p-5 gap-3 relative">
        
        <!-- ================= 1. 上方狀態與控制列 ================= -->
        <header class="flex justify-between items-center bg-slate-950/90 p-3.5 rounded-xl border border-emerald-900/50 shadow-lg">
            <div>
                <h1 class="text-base font-bold tracking-wider text-emerald-400 flex items-center gap-2 font-mono">
                    <span class="inline-block w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
                    RCTP 桃園國際機場塔台管制
                </h1>
                <p id="metar-info" class="text-[11px] text-emerald-600 font-mono">即時氣象風向計算中...</p>
            </div>
            <div class="flex items-center gap-3">
                <div class="flex gap-2 text-xs font-mono">
                    <div class="bg-slate-900 px-2.5 py-1 rounded-lg border border-emerald-950 text-emerald-300">
                        🏆 得分: <span id="score">0</span>
                    </div>
                    <div class="bg-slate-900 px-2.5 py-1 rounded-lg border border-emerald-950 text-emerald-300">
                        ✈️ 空中: <span id="plane-count">0</span>
                    </div>
                </div>
                <button id="pause-btn" onclick="togglePause()" class="bg-emerald-950 hover:bg-emerald-900 text-emerald-300 px-3 py-1 rounded-lg border border-emerald-700/50 text-xs font-bold cursor-pointer transition font-mono">
                    暫停
                </button>
            </div>
        </header>

        <!-- ================= 2. 遊戲雷達畫面區 (600x600) ================= -->
        <main class="flex flex-col items-center justify-center relative bg-slate-950 rounded-xl overflow-hidden border-2 border-emerald-800/60 shadow-inner">
            
            <!-- 雷達背景裝飾層 -->
            <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
                <div class="w-[560px] h-[560px] rounded-full border border-emerald-900/30 absolute"></div>
                <div class="w-[380px] h-[380px] rounded-full border border-emerald-900/30 absolute"></div>
                <div class="w-[180px] h-[180px] rounded-full border border-emerald-900/30 absolute"></div>
                <div class="w-full h-[1px] bg-emerald-900/40 absolute"></div>
                <div class="w-[1px] h-full bg-emerald-900/40 absolute"></div>
                <div class="w-[560px] h-[560px] rounded-full absolute overflow-hidden">
                    <div class="radar-sweep-line w-[280px] h-[280px] absolute top-1/2 left-1/2"></div>
                </div>
            </div>

            <!-- HTML5 Canvas 畫布 -->
            <canvas id="radarCanvas" width="600" height="600" class="block w-full max-w-[560px] aspect-square relative z-10 cursor-crosshair"></canvas>
            
            <!-- 遊戲開始前的覆蓋提示畫面 -->
            <div id="start-screen" class="absolute inset-0 bg-slate-950/90 backdrop-blur-xs flex flex-col items-center justify-center gap-4 p-6 z-30 text-center">
                <h2 class="text-2xl font-black text-emerald-400 tracking-wider font-mono">RCTP 塔台管制總指揮</h2>
                <p class="text-xs text-emerald-300 max-w-[340px] leading-relaxed font-mono">
                    依據真實 METAR 氣象風向自動決定起降跑道！請引導減速降落的 <span class="text-amber-300 font-bold">[ARR]</span> 航班（約 120-140 kts）順應風向完成五邊進場（高度 $\le 3000$ ft）。過境機 <span class="text-slate-400">[ENR]</span> 無需理會。
                </p>
                <button onclick="startGame()" class="bg-emerald-600 hover:bg-emerald-500 text-slate-950 font-bold px-6 py-2.5 rounded-xl shadow-lg transition active:scale-95 cursor-pointer text-sm font-mono">
                    開始執勤 🚀
                </button>
            </div>
        </main>

        <!-- ================= 3. 下方選中飛機控制面板 ================= -->
        <div id="control-panel" class="bg-slate-950/90 p-3 rounded-xl border border-emerald-900/50 flex justify-between items-center text-xs">
            <div class="flex items-center gap-2">
                <span class="text-slate-400 font-mono">選中航機：</span>
                <span id="selected-plane-info" class="font-mono text-amber-300 font-bold">未選取 (點擊畫布上飛機)</span>
            </div>
            <div class="flex items-center gap-2 font-mono">
                <span class="text-slate-400">高度指令:</span>
                <button onclick="adjustAltitude(-1000)" class="bg-slate-900 hover:bg-slate-800 text-emerald-300 px-2.5 py-1 rounded border border-emerald-900/60 cursor-pointer active:scale-95 transition">下降 -1000ft</button>
                <button onclick="adjustAltitude(1000)" class="bg-slate-900 hover:bg-slate-800 text-emerald-300 px-2.5 py-1 rounded border border-emerald-900/60 cursor-pointer active:scale-95 transition">爬升 +1000ft</button>
            </div>
        </div>

        <!-- 底部版權 -->
        <footer class="text-center text-[10px] text-emerald-700 font-mono">
            Vibe Coding - ATC Simulator RCTP Professional Edition
        </footer>
    </div>

    <!-- ================= 4. 遊戲結束彈窗 Modal ================= -->
    <div id="game-over-modal" class="fixed inset-0 bg-black/85 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="bg-slate-900 rounded-2xl p-6 w-full max-w-sm text-center shadow-2xl border-2 border-rose-600 flex flex-col gap-4">
            <div>
                <h2 class="text-2xl font-black text-rose-500 mb-1 font-mono">💥 空中相撞事故！</h2>
                <p id="game-over-text" class="text-slate-300 text-xs font-mono">同高度層航機未保持安全距離發生碰撞。</p>
            </div>
            <button onclick="startGame()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-slate-950 font-bold py-3 rounded-xl shadow-lg transition active:scale-95 cursor-pointer text-sm font-mono">
                重新上任 🎮
            </button>
        </div>
    </div>

    <!-- ================= 核心 JavaScript 邏輯 ================= -->
    <script>
        const canvas = document.getElementById('radarCanvas');
        const ctx = canvas.getContext('2d');

        const WIDTH = canvas.width;
        const HEIGHT = canvas.height;
        const CENTER_X = WIDTH / 2;
        const CENTER_Y = HEIGHT / 2;

        const runways = [
            { idTop: '05L', idBottom: '23R', x: WIDTH / 2 - 45, y: HEIGHT / 2 - 100, w: 24, h: 200 },
            { idTop: '05R', idBottom: '23L', x: WIDTH / 2 + 21, y: HEIGHT / 2 - 100, w: 24, h: 200 }
        ];

        const airlines = ['CI', 'BR', 'JX', 'CX', 'JL', 'SQ'];

        let currentMetar = {
            windDir: 40,
            windSpeed: 5,
            activeRunwayConfig: '05'
        };

        function updateMetarDisplay() {
            if (currentMetar.windDir >= 320 || currentMetar.windDir <= 140) {
                currentMetar.activeRunwayConfig = '05';
            } else {
                currentMetar.activeRunwayConfig = '23';
            }

            document.getElementById('metar-info').textContent = 
                `METAR RCTP 風向: ${currentMetar.windDir}° / ${currentMetar.windSpeed}kt | 現用起降配置: ${currentMetar.activeRunwayConfig} 跑道`;
        }

        let audioCtx = null;

        function initAudio() {
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
            } catch (e) {
                console.warn('Audio blocked or not supported', e);
            }
        }

        function playLandSound() {
            try {
                initAudio();
                if (!audioCtx) return;
                const notes = [523.25, 659.25, 783.99];
                notes.forEach((freq, index) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, audioCtx.currentTime + index * 0.08);
                    gain.gain.setValueAtTime(0.15, audioCtx.currentTime + index * 0.08);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + index * 0.08 + 0.15);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(audioCtx.currentTime + index * 0.08);
                    osc.stop(audioCtx.currentTime + index * 0.08 + 0.15);
                });
            } catch (e) {}
        }

        function playCrashSound() {
            try {
                initAudio();
                if (!audioCtx) return;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(40, audioCtx.currentTime + 0.5);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.5);
            } catch (e) {}
        }

        let planes = [];
        let score = 0;
        let isPlaying = false;
        let isPaused = false;
        let spawnTimer = null;
        let sweepAngle = 0;

        let selectedPlane = null;
        let mousePos = { x: 0, y: 0 };
        let hoverPlane = null;

        function spawnPlane() {
            if (!isPlaying || isPaused) return;

            const airline = airlines[Math.floor(Math.random() * airlines.length)];
            const flightCode = airline + Math.floor(100 + Math.random() * 900);
            
            const isArrival = Math.random() < 0.6; 
            const flightRules = isArrival ? 'ARR' : 'ENR';
            
            let x, y, targetX, targetY, speed, altitude;
            const padding = 30;

            if (isArrival) {
                speed = 0.25 + Math.random() * 0.1;
                altitude = 3000;

                if (currentMetar.activeRunwayConfig === '05') {
                    x = WIDTH / 2 + (Math.random() - 0.5) * 300;
                    y = HEIGHT + padding;
                    targetX = WIDTH / 2 + (Math.random() - 0.5) * 40;
                    targetY = HEIGHT / 2;
                } else {
                    x = WIDTH / 2 + (Math.random() - 0.5) * 300;
                    y = -padding;
                    targetX = WIDTH / 2 + (Math.random() - 0.5) * 40;
                    targetY = HEIGHT / 2;
                }
            } else {
                speed = 0.45 + Math.random() * 0.25;
                const side = Math.floor(Math.random() * 4);
                if (side === 0) {
                    x = Math.random() * WIDTH; y = -padding;
                    targetX = Math.random() * WIDTH; targetY = HEIGHT + padding;
                } else if (side === 1) {
                    x = WIDTH + padding; y = Math.random() * HEIGHT;
                    targetX = -padding; targetY = Math.random() * HEIGHT;
                } else if (side === 2) {
                    x = Math.random() * WIDTH; y = HEIGHT + padding;
                    targetX = Math.random() * WIDTH; targetY = -padding;
                } else {
                    x = -padding; y = Math.random() * HEIGHT;
                    targetX = WIDTH + padding; targetY = Math.random() * HEIGHT;
                }
                const headingDeg = (Math.atan2(targetY - y, targetX - x) * 180 / Math.PI + 360) % 360;
                const isEastbound = headingDeg >= 0 && headingDeg < 180;
                altitude = isEastbound ? 7000 : 8000;
            }

            const angle = Math.atan2(targetY - y, targetX - x);
            const speedKts = isArrival ? Math.floor(120 + Math.random() * 20) : Math.floor(220 + Math.random() * 100);

            planes.push({
                id: flightCode,
                type: flightRules,
                x: x,
                y: y,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                speedValue: speed,
                altitude: altitude,
                speedKts: speedKts,
                flashAlpha: 0.2,
                isLanding: false,
                isWarning: false
            });

            updateUI();
        }

        function updateUI() {
            document.getElementById('plane-count').textContent = planes.length;
            document.getElementById('score').textContent = score;

            const infoEl = document.getElementById('selected-plane-info');
            if (selectedPlane) {
                infoEl.textContent = `${selectedPlane.id} [${selectedPlane.type}] - FL${Math.floor(selectedPlane.altitude/100)} (${selectedPlane.speedKts}kt)`;
            } else {
                infoEl.textContent = '未選取 (點擊畫布上飛機)';
            }
        }

        function startGame() {
            try {
                initAudio();
            } catch (e) {
                console.warn('Audio init warning:', e);
            }

            const startScreen = document.getElementById('start-screen');
            if (startScreen) startScreen.classList.add('hidden');

            const gameOverModal = document.getElementById('game-over-modal');
            if (gameOverModal) gameOverModal.classList.add('hidden');

            updateMetarDisplay();

            planes = [];
            score = 0;
            isPlaying = true;
            isPaused = false;
            selectedPlane = null;
            document.getElementById('pause-btn').textContent = '暫停';
            updateUI();

            clearInterval(spawnTimer);
            spawnTimer = setInterval(spawnPlane, 4000);

            spawnPlane();
            setTimeout(spawnPlane, 2000);
        }

        function togglePause() {
            if (!isPlaying) return;
            isPaused = !isPaused;
            document.getElementById('pause-btn').textContent = isPaused ? '繼續' : '暫停';
        }

        function adjustAltitude(amount) {
            if (!selectedPlane) return;
            selectedPlane.altitude = Math.max(1000, Math.min(10000, selectedPlane.altitude + amount));
            updateUI();
        }

        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            mousePos.x = e.clientX - rect.left;
            mousePos.y = e.clientY - rect.top;

            hoverPlane = null;
            for (let p of planes) {
                if (p.isLanding) continue;
                if (Math.hypot(p.x - mousePos.x, p.y - mousePos.y) <= 60) {
                    hoverPlane = p;
                    break;
                }
            }
            canvas.style.cursor = hoverPlane ? 'pointer' : 'crosshair';
        });

        canvas.addEventListener('click', (e) => {
            if (!isPlaying || isPaused) return;
            const rect = canvas.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const clickY = e.clientY - rect.top;

            let clickedPlane = null;
            for (let p of planes) {
                if (p.isLanding) continue;
                const dist = Math.hypot(p.x - clickX, p.y - clickY);
                if (dist <= 60) {
                    clickedPlane = p;
                    break;
                }
            }

            if (clickedPlane) {
                selectedPlane = clickedPlane;
                updateUI();
            } else if (selectedPlane) {
                const angle = Math.atan2(clickY - selectedPlane.y, clickX - selectedPlane.x);
                selectedPlane.vx = Math.cos(angle) * selectedPlane.speedValue;
                selectedPlane.vy = Math.sin(angle) * selectedPlane.speedValue;
                
                selectedPlane = null;
                updateUI();
            }
        });

        function gameLoop() {
            if (isPlaying && !isPaused) {
                update();
                render();
            } else if (isPlaying && isPaused) {
                render();
            }
            requestAnimationFrame(gameLoop);
        }

        function update() {
            sweepAngle = (sweepAngle + 0.03) % (Math.PI * 2);

            planes.forEach(p => p.isWarning = false);

            for (let i = 0; i < planes.length; i++) {
                for (let j = i + 1; j < planes.length; j++) {
                    let p1 = planes[i];
                    let p2 = planes[j];
                    if (p1.isLanding || p2.isLanding) continue;

                    const dist = Math.hypot(p1.x - p2.x, p1.y - p2.y);
                    const altDiff = Math.abs(p1.altitude - p2.altitude);

                    if (altDiff < 1000) {
                        if (dist < 18) {
                            playCrashSound();
                            triggerGameOver();
                            return;
                        } else if (dist < 45) {
                            p1.isWarning = true;
                            p2.isWarning = true;
                        }
                    }
                }
            }

            for (let i = planes.length - 1; i >= 0; i--) {
                let p = planes[i];

                if (p.isLanding) {
                    p.radius = (p.radius || 6) * 0.95;
                    if (p.radius < 0.5) {
                        planes.splice(i, 1);
                        updateUI();
                    }
                    continue;
                }

                p.x += p.vx;
                p.y += p.vy;

                const planeAngle = Math.atan2(p.y - CENTER_Y, p.x - CENTER_X);
                let angleDiff = Math.abs(sweepAngle - planeAngle);
                if (angleDiff > Math.PI) angleDiff = Math.PI * 2 - angleDiff;

                if (angleDiff < 0.12) {
                    p.flashAlpha = 1.0;
                } else {
                    p.flashAlpha = Math.max(0.25, p.flashAlpha * 0.95);
                }

                for (let rw of runways) {
                    let validHeading = false;
                    if (currentMetar.activeRunwayConfig === '05' && p.vy < 0) {
                        validHeading = true;
                    } else if (currentMetar.activeRunwayConfig === '23' && p.vy > 0) {
                        validHeading = true;
                    }

                    if (
                        p.type === 'ARR' &&
                        p.x >= rw.x && p.x <= rw.x + rw.w &&
                        p.y >= rw.y && p.y <= rw.y + rw.h &&
                        p.altitude <= 3000 &&
                        validHeading
                    ) {
                        score += 250;
                        p.isLanding = true;
                        playLandSound();
                        updateUI();
                        break;
                    }
                }

                const margin = 70;
                if (p.x < -margin || p.x > WIDTH + margin || p.y < -margin || p.y > HEIGHT + margin) {
                    planes.splice(i, 1);
                    updateUI();
                }
            }
        }

        function triggerGameOver() {
            isPlaying = false;
            clearInterval(spawnTimer);
            document.getElementById('game-over-text').textContent = `同高度層發生空中相撞！最終得分：${score} 分`;
            document.getElementById('game-over-modal').classList.remove('hidden');
        }

        function render() {
            ctx.fillStyle = 'rgba(2, 6, 23, 0.35)';
            ctx.fillRect(0, 0, WIDTH, HEIGHT);

            runways.forEach(rw => {
                ctx.fillStyle = '#1e293b';
                ctx.fillRect(rw.x, rw.y, rw.w, rw.h);
                ctx.strokeStyle = '#22c55e';
                ctx.lineWidth = 1.5;
                ctx.strokeRect(rw.x, rw.y, rw.w, rw.h);

                ctx.fillStyle = '#86efac';
                ctx.font = '9px monospace';
                ctx.fillText(rw.idTop, rw.x + 3, rw.y + 14);
                ctx.fillText(rw.idBottom, rw.x + 3, rw.y + rw.h - 6);

                ctx.strokeStyle = '#e2e8f0';
                ctx.lineWidth = 1;
                ctx.setLineDash([6, 6]);
                ctx.beginPath();
                ctx.moveTo(rw.x + rw.w / 2, rw.y + 20);
                ctx.lineTo(rw.x + rw.w / 2, rw.y + rw.h - 15);
                ctx.stroke();
                ctx.setLineDash([]);
            });

            if (selectedPlane) {
                ctx.strokeStyle = '#facc15';
                ctx.lineWidth = 1.5;
                ctx.setLineDash([4, 4]);
                ctx.beginPath();
                ctx.moveTo(selectedPlane.x, selectedPlane.y);
                ctx.lineTo(mousePos.x, mousePos.y);
                ctx.stroke();
                ctx.setLineDash([]);

                ctx.fillStyle = '#facc15';
                ctx.beginPath();
                ctx.arc(mousePos.x, mousePos.y, 4, 0, Math.PI * 2);
                ctx.fill();
            }

            planes.forEach(p => {
                const isSelected = (selectedPlane === p);
                const isHovered = (hoverPlane === p);

                if (p.isLanding) {
                    ctx.fillStyle = '#fbbf24';
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.radius || 6, 0, Math.PI * 2);
                    ctx.fill();
                    return;
                }

                if (isHovered && !isSelected) {
                    ctx.strokeStyle = 'rgba(250, 204, 21, 0.4)';
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, 25, 0, Math.PI * 2);
                    ctx.stroke();
                }

                if (p.isWarning) {
                    ctx.strokeStyle = '#ef4444';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, 18, 0, Math.PI * 2);
                    ctx.stroke();
                }

                if (isSelected) {
                    ctx.strokeStyle = '#facc15';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, 14, 0, Math.PI * 2);
                    ctx.stroke();
                }

                const baseColor = p.isWarning ? [239, 68, 68] : (isSelected ? [250, 204, 21] : [34, 197, 94]);
                const alphaColor = `rgba(${baseColor[0]}, ${baseColor[1]}, ${baseColor[2]}, ${p.flashAlpha})`;

                ctx.fillStyle = alphaColor;
                ctx.shadowColor = alphaColor;
                ctx.shadowBlur = p.isWarning ? 15 : (p.flashAlpha > 0.8 ? 12 : 4);
                ctx.beginPath();
                ctx.arc(p.x, p.y, 5, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;

                ctx.strokeStyle = p.isWarning ? `rgba(239, 68, 68, ${p.flashAlpha * 0.8})` : (isSelected ? `rgba(250, 204, 21, ${p.flashAlpha * 0.8})` : `rgba(34, 197, 94, ${p.flashAlpha * 0.4})`);
                ctx.lineWidth = isSelected || p.isWarning ? 2 : 1;
                ctx.beginPath();
                ctx.moveTo(p.x, p.y);
                ctx.lineTo(p.x - p.vx * 20, p.y - p.vy * 20);
                ctx.stroke();

                const labelColor = p.type === 'ARR' ? '#fbbf24' : '#86efac';
                ctx.fillStyle = p.isWarning ? '#fca5a5' : (isSelected ? '#fef08a' : labelColor);
                ctx.font = '10px monospace';
                ctx.fillText(`${p.id} [${p.type}]`, p.x + 12, p.y - 8);
                ctx.fillStyle = p.isWarning ? '#f87171' : `rgba(74, 222, 128, ${Math.max(0.5, p.flashAlpha)})`;
                ctx.fillText(`FL${Math.floor(p.altitude / 100)} (${p.speedKts}kt)`, p.x + 12, p.y + 4);
            });
        }

        window.onload = function() {
            requestAnimationFrame(gameLoop);
        };
    </script>
</body>
</html>
